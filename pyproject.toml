[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "求职流水线：建档、找岗、筛岗、网申填表、台账、回执监控"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "gobulihx"}]
keywords = ["job", "resume", "claude-code", "skill", "china"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
browser = ["playwright>=1.40"]
dev = ["ruff>=0.5"]

[tool.setuptools]
packages = ["jobpilot", "jobpilot.backends"]
include-package-data = true

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
