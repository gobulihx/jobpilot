name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: 单元测试 py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet ruff
      - run: ruff check .
      - run: python -m unittest discover -s tests -t . -v

  e2e:
    name: 浏览器夹具
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.e2e.test_fill -v

  no-extras:
    name: 裸 Python 降级
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m jobpilot doctor --json
      - run: |
          export JOBPILOT_HOME=$(mktemp -d)
          python -m jobpilot init --demo
          python -m jobpilot demo
          python -m jobpilot ledger list

  privacy:
    name: 隐私扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m jobpilot privacy scan
      - name: 大文件检查
        run: |
          find . -type f -size +2M -not -path './.git/*' | tee /tmp/big
          test ! -s /tmp/big
