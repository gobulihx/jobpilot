name: 站点卡
description: 想让某个招聘站开箱即用
body:
  - type: input
    id: site
    attributes:
      label: 站点
      description: 域名，不要贴账号
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: 页面结构
      description: 贴脱敏后的字段标签和控件类型（不要贴值）
  - type: textarea
    id: quirks
    attributes:
      label: 遇到的坑
      description: 比如保存报错但数据已存、上一步回退空白
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 内容已脱敏，没有账号、密码、真实个人信息
          required: true
